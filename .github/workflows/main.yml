name: Windows-Powerful-Tailscale
on: workflow_dispatch

jobs:
  build:
    # Larger Runner 4-core: 4 vCPU, 16 GB RAM, 150 GB SSD
    # LƯU Ý: label phải khớp với tên runner đã tạo trong Organization Settings > Actions > Runners.
    # Ví dụ phổ biến: windows-2022-4core / windows-11-4core
    # Nếu chưa có Larger Runner, đổi lại thành: windows-latest
    runs-on: windows-2022-4core

    steps:
    - name: 1. Install Tailscale via Winget
      shell: powershell
      run: |
        winget install Tailscale.Tailscale --silent --accept-source-agreements --accept-package-agreements
        $TailscalePath = "C:\Program Files\Tailscale\tailscale.exe"
        while (!(Test-Path $TailscalePath)) { Start-Sleep -Seconds 2 }
        $env:TAILSCALE_AUTH_KEY = "${{ secrets.TAILSCALE_AUTH_KEY }}"
        & $TailscalePath up --authkey=$env:TAILSCALE_AUTH_KEY --accept-routes

    - name: 2. Kich hoat Remote Desktop va Tai khoan
      shell: powershell
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $Password = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password

    - name: 3. Don dep va Ep tang toc o cung SSD (Lay them dung luong trong)
      shell: powershell
      run: |
        Write-Host "Dang xoa cac bo cache va cong cu du thua de lam trong o cung SSD..."
        Remove-Item -Path "C:\hostedtoolcache" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\agent" -Recurse -Force -ErrorAction SilentlyContinue

        Write-Host "Dang kich hoat lenh TRIM toi uu hoa toc do SSD..."
        Optimize-Volume -DriveLetter C -Defrag -Verbose

    - name: 4. Cai Mesa3D software OpenGL renderer (thay driver GPU ao)
      uses: ssciwr/setup-mesa-dist-win@v3
      with:
        version: '26.0.3'
        build-type: 'release-msvc'
        deployment-choice: '1'

    - name: 5. Xac nhan cau hinh CPU / RAM / Mesa
      shell: powershell
      run: |
        Write-Host "===== CAU HINH MAY AO ====="
        Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
        Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory
        Write-Host "===== Kiem tra Mesa3D ====="
        if ($env:GALLIUM_DRIVER) { Write-Host "GALLIUM_DRIVER = $env:GALLIUM_DRIVER" }
        if ($env:MESA_LOADER_DRIVER_OVERRIDE) { Write-Host "MESA_LOADER_DRIVER_OVERRIDE = $env:MESA_LOADER_DRIVER_OVERRIDE" }
        Get-ChildItem -Path "C:\" -Filter "opengl32.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

    - name: 6. Duy tri va Treo game
      shell: powershell
      run: |
        Write-Host "May ao da toi uu SSD xong va dang chay!"
        Write-Host "Runner: 4 vCPU / 16 GB RAM"
        Write-Host "OpenGL: Mesa3D (llvmpipe - software renderer)"
        Start-Sleep -Seconds 21600
