name: Kich Hoat May Ao Mien Phi Qua Pinggy

on: 
  workflow_dispatch: # Bấm nút chạy thủ công trên giao diện web

jobs:
  fast-rdp:
    runs-on: ubuntu-latest # Dùng máy ảo Linux khởi động siêu tốc

    steps:
      - name: Khoi tao duong truyen lay IP dang nhap truc tiep
        run: |
          echo "=================================================="
          echo " DANG KICH HOAT DUONG TRUYEN TOC DO CAO PINGGY "
          echo "=================================================="
          
          # Khởi chạy cổng kết nối ngầm qua hệ thống Pinggy (Không cần cài đặt, không cần token)
          ssh -p 443 -R0:localhost:22 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 a.pinggy.io > pinggy.log &
          
          # Đợi 5 giây để hệ thống thiết lập đường truyền ổn định
          sleep 5
          
          # Truy xuất đường link kết nối công khai được cấp và in thẳng ra màn hình log
          echo "=================================================="
          echo " ĐỊA CHỈ IP KẾT NỐI ĐĂNG NHẬP CỦA BẠN LÀ:"
          echo "=================================================="
          grep -o 'tcp://.*' pinggy.log | sed 's/tcp:\/\///' || echo "Chưa lấy được IP, vui lòng bấm chạy lại!"
          echo "=================================================="
          
          # Giữ máy ảo chạy liên tục để bạn sử dụng
          sleep 21600
