name: Kich Hoat May Ao Sieu Toc Co Ngay IP

on: 
  workflow_dispatch: 

jobs:
  fast-rdp:
    runs-on: ubuntu-latest 

    steps:
      - name: 1. Cai dat Ngrok chinh thuc tu he thong va Lay IP
        run: |
          echo "=== DANG KICH HOAT DUONG TRUYEN TOC DO CAO ==="
          
          # Cài đặt Ngrok bản mới nhất chính thức thông qua Snapcraft của Ubuntu (Không lo lỗi link tải)
          sudo snap install ngrok
          
          # Cấu hình Token của bạn
          ngrok config add-authtoken "3LmAI46qVE5SpRkry5WpXFJltSs_6Ada1J5ciNdAvdMZKcG8u"
          
          # Khởi chạy cổng kết nối ngầm qua vùng Châu Á (ap) để giảm lag
          ngrok tcp 22 --region ap > /dev/null &
          
          # Đợi 5 giây để hệ thống thiết lập đường truyền ổn định
          sleep 5
          
          # Truy xuất và in thẳng địa chỉ IP kết nối ra màn hình log công khai
          echo "=================================================="
          echo " ĐỊA CHỈ IP KẾT NỐI ĐĂNG NHẬP CỦA BẠN LÀ:"
          echo "=================================================="
          curl -s http://localhost:4040/api/tunnels | grep -o '0.tcp.ap.ngrok.io:[0-9]*' || echo "Chưa lấy được IP, vui lòng bấm chạy lại!"
          echo "=================================================="
          
          # Giữ máy ảo chạy liên tục để bạn sử dụng
          sleep 21600
