name: Chay May Ao Mien Phi GitHub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Tạo nút bấm chạy thủ công trên web

jobs:
  free-job:
    # Đổi từ self-hosted sang ubuntu-latest (máy Linux chạy mượt và nhanh nhất)
    runs-on: ubuntu-latest 

    steps:
      - name: Keo code tu Repository ve may ao
        uses: actions/checkout@v4

      # MÁY ẢO CỦA GITHUB ĐÃ CÓ SẴN PYTHON, BẠN CHỈ CẦN GỌI RA DÙNG:
      - name: Chay thu nghiem xem cau hinh may mien phi
        run: |
          echo "=== Thong tin CPU may ao GitHub ==="
          lscpu | grep "Model name"
          echo "=== Thong tin RAM may ao GitHub ==="
          free -h
          echo "=== Kiem tra phien ban Python co san ==="
          python3 --version
