name: Tao Terminal Dieu Khien Tren Trinh Duyet Web

on: 
  workflow_dispatch: # Bấm nút chạy thủ công trên web

jobs:
  web-terminal:
    runs-on: ubuntu-latest # Dùng máy ảo Linux khởi động siêu tốc

    steps:
      - name: 1. Cai dat va Khoi tao Terminal giao dien Web
        run: |
          echo "=================================================="
          echo " DANG KHOI TAO TERMINAL WEB TOI UU "
          echo "=================================================="
          
          # Cài đặt công cụ ttsh (Web-based terminal) để biến dòng lệnh thành trang web
          curl -sLk https://githubusercontent.com | bash
          
          # Cài đặt công cụ tạo link công khai localtunnel công nghệ NodeJS
          sudo npm install -g localtunnel
          
          # Cho phép khởi chạy máy chủ dòng lệnh trên cổng 8080 ngầm
          ./gotty -w --port 8080 bash > /dev/null 2>&1 &
          
          # Đợi 3 giây để máy chủ cục bộ hoạt động ổn định
          sleep 3
          
          # Kích hoạt tạo đường link trang web public không cần tài khoản
          lt --port 8080 > localtunnel.log 2>&1 &
          
          # Đợi 5 giây để localtunnel cấp link web sạch
          sleep 5
          
          echo "=================================================="
          echo " ĐƯỜNG LINK TRANG WEB ĐIỀU KHIỂN CỦA BẠN LÀ:"
          echo "=================================================="
          cat localtunnel.log
          echo "=================================================="
          
          # Giữ máy ảo chạy liên tục trong 6 tiếng để bạn treo tác vụ
          sleep 21600
