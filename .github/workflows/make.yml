name: Kich Hoat Windows Server Va Hien Thi IP Tu Dong

on: 
  workflow_dispatch: # Tạo nút bấm chạy thủ công trên web

jobs:
  build:
    runs-on: windows-latest # Dùng máy ảo Windows Server cấu hình cao có sẵn của GitHub

    steps:
      - name: 1. Bat Remote Desktop va Thiet lap mat khau
        run: |
          # Đặt mật khẩu đăng nhập cho máy ảo là: RDPuser123
          net user runneradmin RDPuser123
          
          # Kích hoạt tính năng Remote Desktop của Windows Server
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 2. Kich hoat duong truyen va tu dong in thong tin dang nhap
        uses: mxschmitt/action-tmate@v3
