name: Chay Script Tu Dong Khong Lo Loi Ket Noi

on: 
  workflow_dispatch: # Tạo nút bấm để bạn kích hoạt chạy thủ công bất cứ lúc nào

jobs:
  automation-job:
    runs-on: ubuntu-latest # Dùng máy ảo Linux miễn phí cấu hình cao của GitHub

    steps:
      - name: 1. Keo toan bo file code tu kho luu tru ve may ao
        uses: actions/checkout@v4

      - name: 2. Kiem tra thong tin va Khoi tao moi truong
        run: |
          echo "=================================================="
          echo "    MAY AO GITHUB DA KICH HOAT THANH CONG"
          echo "=================================================="
          echo "Cau hinh RAM cua may:"
          free -h
          echo "Phiên ban Python co san:"
          python3 --version

      - name: 3. Tu dong chay file code cua ban (Sua bot.py thanh file cua ban)
        run: |
          # BƯỚC NÀY SẼ TỰ ĐỘNG CHẠY FILE CODE CỦA BẠN:
          # Nếu code của bạn cần cài thư viện, hãy bỏ dấu # ở dòng dưới ra:
          # pip install -r requirements.txt
          
          # Lệnh kích hoạt file code chính của bạn (Ví dụ file tên là bot.py)
          # Bạn hãy tải file code của bạn lên kho lưu trữ GitHub này nhé
          python3 bot.py
